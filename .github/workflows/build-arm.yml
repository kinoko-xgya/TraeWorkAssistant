name: Build ARM64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag to build
        required: true
        default: docker_main
        type: string
      image_tag:
        description: Image tag (留空 = 自动取 package.json 版本)
        required: false
        default: ''
        type: string
      push:
        description: Push image to GHCR
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-arm64:
    name: Build & push ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve source version and sha
        id: src
        run: |
          SHA="$(git rev-parse HEAD)"
          VER="$(node -p "require('./package.json').version")"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # image_tag 留空则用源仓库 package.json 版本，避免人工标签与代码脱节
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="$VER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building ref: ${{ inputs.ref }}"
          echo "Resolved source sha: $SHA"
          echo "Source version: $VER"
          echo "Image tag: $TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          platforms: linux/arm64

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: ${{ inputs.push }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiwork-arm:${{ steps.src.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/aiwork-arm:sha-${{ steps.src.outputs.sha }}
          cache-from: type=gha,scope=arm64-${{ inputs.ref }}
          cache-to: type=gha,scope=arm64-${{ inputs.ref }},mode=max
          provenance: false

      - name: Image info
        run: |
          echo "=== Built images ==="
          echo "build ref : ${{ inputs.ref }}"
          echo "image     : ${{ steps.src.outputs.tag }} (source version ${{ steps.src.outputs.version }})"
          echo "sha tag   : sha-${{ steps.src.outputs.sha }}"
          echo ""
          echo "Pull command:"
          echo "docker pull ghcr.io/${{ github.repository_owner }}/aiwork-arm:${{ steps.src.outputs.tag }}"
