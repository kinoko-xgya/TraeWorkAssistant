name: Build ARM64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag to build
        required: true
        default: docker_main
        type: string
      image_tag:
        description: Image tag
        required: true
        default: latest
        type: string
      push:
        description: Push image to GHCR
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-arm64:
    name: Build & push ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Show build info
        run: |
          echo "Building ref: ${{ inputs.ref }}"
          echo "Image tag: ${{ inputs.image_tag }}"
          echo "SHA: ${{ github.sha }}"
          uname -a

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          platforms: linux/arm64

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: ${{ inputs.push }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiwork-arm:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/aiwork-arm:sha-${{ github.sha }}
          cache-from: type=gha,scope=arm64-${{ inputs.ref }}
          cache-to: type=gha,scope=arm64-${{ inputs.ref }},mode=max
          provenance: false

      - name: Image info
        run: |
          echo "=== Built images ==="
          echo "ghcr.io/${{ github.repository_owner }}/aiwork-arm:${{ inputs.image_tag }}"
          echo "ghcr.io/${{ github.repository_owner }}/aiwork-arm:sha-${{ github.sha }}"
          echo ""
          echo "Pull command:"
          echo "docker pull ghcr.io/${{ github.repository_owner }}/aiwork-arm:${{ inputs.image_tag }}"
